<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Minder Leads — Settings</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <style>
      body { max-width: 560px; margin: 0 auto; padding: 24px 24px 80px; }
      h1 { font-family: "Newsreader", Georgia, serif; font-size: 22px; margin: 0 0 4px; font-weight: 600; }
      .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
      .card h2 { margin: 0 0 10px; font-size: 13px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
      .footer-inline { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
      .btn-primary { width: auto; padding: 0 18px; }
      .status { font-size: 12px; color: var(--muted); margin-top: 8px; }
      .status.ok { color: var(--teal); }
      .status.err { color: #8a3a22; }
    </style>
  </head>
  <body>
    <h1>Minder Leads — Settings</h1>
    <p class="sub">Paste your Supabase credentials and dashboard URL. Stored locally via chrome.storage.sync.</p>

    <div class="card">
      <h2>Supabase</h2>
      <label><span>Project URL</span><input id="supabaseUrl" placeholder="https://xxxxxxxx.supabase.co" /></label>
      <label><span>Anon / publishable key</span><input id="supabaseKey" placeholder="sb_publishable_... or eyJ..." /></label>
    </div>

    <div class="card">
      <h2>Dashboard</h2>
      <label><span>Dashboard URL</span><input id="dashboardUrl" placeholder="https://minder-leads.vercel.app" /></label>
    </div>

    <div class="footer-inline">
      <span class="status" id="status"></span>
      <button class="btn-primary" id="save">Save settings</button>
    </div>

    <script src="options.js"></script>
  </body>
</html>
